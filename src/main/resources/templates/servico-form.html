<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE SERVIÇO</title>

    <link rel="stylesheet" th:href="@{/css/sistema.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img class="logo-imagem" th:src="@{/img/logo.png}" alt="Logo OrdemPro">
        </div>

        <nav class="sidebar-menu">

            <a class="sidebar-link home-link" th:href="@{/ordens}">
                <i class="bi bi-house-door-fill"></i>
                HOME
            </a>

            <div class="menu-group" sec:authorize="hasAnyRole('ADMIN', 'GERENTE', 'VENDEDOR')">
                <button type="button" class="menu-toggle active" onclick="alternarSubmenu('submenu-cadastro')">
                    <i class="bi bi-person-plus-fill"></i>
                    CADASTRO
                </button>

                <div id="submenu-cadastro" class="submenu aberto">
                    <a class="submenu-link" th:href="@{/clientes}">
                        <i class="bi bi-person-vcard"></i>
                        CLIENTE
                    </a>

                    <a class="submenu-link"
                       sec:authorize="hasAnyRole('ADMIN', 'GERENTE')"
                       th:href="@{/cidades}">
                        <i class="bi bi-geo-alt-fill"></i>
                        CIDADE
                    </a>

                    <a class="submenu-link active"
                       sec:authorize="hasAnyRole('ADMIN', 'GERENTE')"
                       th:href="@{/servicos}">
                        <i class="bi bi-tools"></i>
                        SERVIÇO
                    </a>

                    <a class="submenu-link"
                       sec:authorize="hasRole('ADMIN')"
                       th:href="@{/usuarios}">
                        <i class="bi bi-person-gear"></i>
                        USUÁRIO
                    </a>
                </div>
            </div>

            <div class="menu-group">
                <button type="button" class="menu-toggle" onclick="alternarSubmenu('submenu-ordens')">
                    <i class="bi bi-clipboard-check-fill"></i>
                    ORDENS DE SERVIÇO
                </button>

                <div id="submenu-ordens" class="submenu">
                    <a class="submenu-link" th:href="@{/ordens}">
                        <i class="bi bi-search"></i>
                        BUSCA
                    </a>

                    <a class="submenu-link" th:href="@{/ordens/nova}">
                        <i class="bi bi-plus-circle-fill"></i>
                        NOVA
                    </a>
                </div>
            </div>

            <a class="sidebar-link sair-link" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right"></i>
                SAIR
            </a>

        </nav>

        <div class="sidebar-user-card">
            <button type="button"
                    class="sidebar-user-button"
                    onclick="abrirModalAlterarSenha()"
                    title="Alterar minha senha">

                <div class="sidebar-user-info">
                    <i class="bi bi-person-circle"></i>

                    <div>
                        <span class="sidebar-user-name"
                              th:text="${usuarioLogadoNome + ' • ' + usuarioLogadoPerfil}">
                            USUÁRIO • PERFIL
                        </span>

                        <span class="sidebar-user-profile">
                            Clique para alterar senha
                        </span>
                    </div>
                </div>

                <i class="bi bi-three-dots-vertical"></i>
            </button>
        </div>

    </aside>

    <main class="main-content">
        <section class="content-card">

            <div class="page-header">
                <div>
                    <h1 class="page-title"
                        th:text="${servico.idServico == null ? 'NOVO SERVIÇO' : 'EDITAR SERVIÇO'}">
                        NOVO SERVIÇO
                    </h1>

                    <p class="page-subtitle">
                        CADASTRO DOS TIPOS DE SERVIÇOS UTILIZADOS NAS ORDENS
                    </p>
                </div>

                <a class="secondary-button" th:href="@{/servicos}">
                    <i class="bi bi-arrow-left-circle"></i>
                    VOLTAR
                </a>
            </div>

            <div th:if="${erro}" class="alerta alerta-erro">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${erro}">Mensagem de erro</span>
            </div>

            <form th:action="@{/servicos/salvar}"
                  th:object="${servico}"
                  method="post"
                  class="form-section">

                <input type="hidden" th:field="*{idServico}">

                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label class="form-label" for="nome">NOME DO SERVIÇO</label>

                        <input class="form-input"
                               type="text"
                               id="nome"
                               th:field="*{nome}"
                               placeholder="EX: Manutenção elétrica"
                               maxlength="100"
                               autocomplete="off"
                               required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="status">STATUS</label>

                        <select class="form-select"
                                id="status"
                                th:field="*{status}"
                                required>

                            <option value="ATIVO">ATIVO</option>
                            <option value="INATIVO">INATIVO</option>

                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">
                        <i class="bi bi-check-circle"></i>
                        SALVAR
                    </button>

                    <a class="secondary-button" th:href="@{/servicos}">
                        <i class="bi bi-x-circle"></i>
                        CANCELAR
                    </a>
                </div>

            </form>

        </section>
    </main>
</div>

<div id="modalAlterarSenha" class="modal-senha-overlay">
    <div class="modal-senha-card">
        <div class="modal-senha-header">
            <h2>ALTERAR SENHA</h2>

            <button type="button"
                    class="modal-senha-fechar"
                    onclick="fecharModalAlterarSenha()"
                    aria-label="Fechar janela de alteração de senha">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <form th:action="@{/usuarios/alterar-senha}" method="post" class="modal-senha-form">
            <div class="form-group">
                <label class="form-label" for="senhaAtual">SENHA ATUAL</label>
                <input class="form-input"
                       type="password"
                       id="senhaAtual"
                       name="senhaAtual"
                       placeholder="Digite sua senha atual"
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="novaSenha">NOVA SENHA</label>
                <input class="form-input"
                       type="password"
                       id="novaSenha"
                       name="novaSenha"
                       minlength="6"
                       placeholder="Digite a nova senha"
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmacaoSenha">CONFIRMAR NOVA SENHA</label>
                <input class="form-input"
                       type="password"
                       id="confirmacaoSenha"
                       name="confirmacaoSenha"
                       minlength="6"
                       placeholder="Confirme a nova senha"
                       required>
            </div>

            <div class="modal-senha-actions">
                <button type="submit" class="primary-button">
                    <i class="bi bi-check-circle"></i>
                    SALVAR SENHA
                </button>

                <button type="button"
                        class="secondary-button"
                        onclick="fecharModalAlterarSenha()">
                    <i class="bi bi-x-circle"></i>
                    CANCELAR
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function abrirModalAlterarSenha() {
        const modal = document.getElementById('modalAlterarSenha');

        if (modal) {
            modal.classList.add('ativo');
        }
    }

    function fecharModalAlterarSenha() {
        const modal = document.getElementById('modalAlterarSenha');

        if (modal) {
            modal.classList.remove('ativo');
        }
    }
</script>

<script th:src="@{/js/sistema.js}"></script>
</body>
</html>
